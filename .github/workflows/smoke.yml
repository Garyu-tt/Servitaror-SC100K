name: SC100K neural smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python neural_alu_r01.py
      - run: python neural_rv32i_r01.py
      - run: python neural_decoder_r02.py
      - run: python neural_register_r03.py
      - run: python neural_control_r04.py
      - run: python neural_math_r05.py
      - run: python neural_atomic_r06.py
      - run: python neural_csr_r07.py
      - run: python neural_priv_r08.py
      - run: python neural_irq_r09.py
      - run: python neural_mmu_r10.py
      - run: python neural_board_r11.py
      - run: python neural_linux_r12.py
      - run: python neural_resume_r13.py --checkpoint /tmp/sc100k-fixture.npz
      - run: python neural_native_r14.py --build-dir /tmp/sc100k-native
      - run: python neural_recurrent_r15.py --build-dir /tmp/sc100k-native-r15
      - run: python neural_tlb_r17.py --build-dir /tmp/sc100k-native-r17
      - run: python neural_dispatch_r19.py --build-dir /tmp/sc100k-native-r19
      - run: python neural_packed_r24.py --build-dir /tmp/sc100k-native-r24
      - run: python neural_hippocampus_r27.py --build-dir /tmp/sc500k-native
