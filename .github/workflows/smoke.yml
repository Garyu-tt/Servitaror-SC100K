name: SC100K neural smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python neural_alu_r01.py
      - run: python neural_rv32i_r01.py
      - run: python neural_decoder_r02.py
      - run: python neural_register_r03.py
      - run: python neural_control_r04.py
      - run: python neural_math_r05.py
      - run: python neural_atomic_r06.py
      - run: python neural_csr_r07.py
      - run: python neural_priv_r08.py
      - run: python neural_irq_r09.py
      - run: python neural_mmu_r10.py
      - run: python neural_board_r11.py
