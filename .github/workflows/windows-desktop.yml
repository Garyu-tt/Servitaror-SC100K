name: Servitaror Windows desktop
on:
  push:
    branches: ['sc500k/r41-windows-desktop']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install "numpy>=2,<3" "pyinstaller>=6.11,<7"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc
      - name: Compile and verify neural DLLs
        shell: msys2 {0}
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          gcc --version
          python desktop.py --prepare-native prebuilt --report native-test.json --cc gcc
      - name: Stage only verified C sources and compiled libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory native-bundle
          Copy-Item prebuilt/native/manifest.json native-bundle/
          $manifest = Get-Content prebuilt/native/manifest.json | ConvertFrom-Json
          foreach ($prop in $manifest.PSObject.Properties) {
            $lib = Get-ChildItem prebuilt/native -Recurse -File -Filter $prop.Name | Select-Object -First 1
            if (!$lib) { throw "Missing native library $($prop.Name)" }
            Copy-Item $lib.FullName native-bundle/
            Copy-Item ([IO.Path]::ChangeExtension($lib.FullName,'.c')) native-bundle/
          }
      - name: Freeze desktop application
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Servitaror --add-data "native-bundle:native" desktop.py
      - name: Test actual frozen executable and native window
        shell: pwsh
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          $root = (Get-Location).Path
          $p = Start-Process -FilePath "$root/dist/Servitaror/Servitaror.exe" -ArgumentList '--self-test',"$root/frozen-test",'--report',"$root/frozen-test.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen executable exited $($p.ExitCode)" }
          $report = Get-Content frozen-test.json | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or !$report.frozen) { throw 'Frozen self-test failed' }
          Get-Content frozen-test.json
      - name: Prepare portable archive
        shell: pwsh
        run: |
          Copy-Item DESKTOP.md dist/Servitaror/README.txt
          Copy-Item native-test.json,frozen-test.json dist/Servitaror/
          Compress-Archive -Path dist/Servitaror -DestinationPath Servitaror-Windows-x64.zip
          Get-FileHash Servitaror-Windows-x64.zip -Algorithm SHA256 | Format-List | Out-File Servitaror-Windows-x64.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Servitaror-Windows-x64
          path: |
            Servitaror-Windows-x64.zip
            Servitaror-Windows-x64.sha256.txt
          if-no-files-found: error
          retention-days: 30

